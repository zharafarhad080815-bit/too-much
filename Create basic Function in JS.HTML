<!--In this activity, learn how to declare functions and invoke functions on-click events.-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Basic Function in JS</title>
    </head>
    <body>
       <button onclick="myFunction(5)">Click Me!</button>
       <script> 
        
            function myFunction(num) {
                let result = num * 2; // Multiply the input number by 2
                alert("The result is: " + result); // Display the result in an alert box
            }
        </script>
       </script>
    </body>
</html>
