<!--In this activity, learn how to store function expression in a variable and use it.-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Function Expression in JS</title>
    </head>
    <body>
       <h1> Function declaration in JS</h1>
       <script> 
        var multiply = function(num) {
            return num * 2; // Multiply the input number by 2
        };
        document.write("The result is: " + multiply(5)); // Call the function and display the result
       </script>
    </body>
</html>
